<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMS Ladies Bags and Abayas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-20">

  <header class="bg-indigo-700 text-white shadow sticky top-0 z-20">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-base sm:text-lg leading-tight">AMS Ladies Bags & Abayas</h1>
        <p class="text-xs text-indigo-200">Billing & Receipt App</p>
      </div>
      <button type="button" onclick="showHistory()" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg text-xs font-bold border border-indigo-500">
        📋 History
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-4 space-y-4">

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">INVOICE NO. ✏️</label>
          <input id="invNum" type="text" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm font-bold text-slate-800 focus:bg-white focus:border-indigo-600 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">DATE</label>
          <input id="invDate" type="text" class="w-full bg-slate-100 border border-slate-200 rounded-lg p-2 text-sm font-semibold text-slate-600 outline-none" readonly />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">STORE NAME</label>
        <input id="bizName" type="text" value="AMS Ladies Bags and Abayas" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm font-semibold outline-none" />
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">CUSTOMER NAME</label>
          <input id="custName" type="text" value="Dear Customer" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">WHATSAPP NUMBER</label>
          <div class="flex">
            <span class="inline-flex items-center px-3 bg-slate-100 border border-r-0 border-slate-300 rounded-l-lg text-xs font-bold text-slate-600">+91</span>
            <input id="custPhone" type="tel" maxlength="10" placeholder="10-digit number" class="w-full bg-slate-50 border border-slate-300 rounded-r-lg p-2 text-sm outline-none" />
          </div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">PAYMENT METHOD</label>
        <select id="paymentMode" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm font-semibold outline-none">
          <option value="Cash">💵 Cash</option>
          <option value="Online / UPI">📱 Online / UPI</option>
        </select>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-xs font-bold text-slate-500 uppercase">Items List</h2>
        <button type="button" onclick="addRow()" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-bold px-3 py-1 rounded-lg text-xs">
          + Add Item
        </button>
      </div>

      <div id="itemsBox" class="space-y-2"></div>

      <div class="bg-slate-900 text-white p-4 rounded-xl flex justify-between items-center mt-3">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-300">Grand Total:</span>
        <span class="text-2xl font-black text-indigo-400">₹<span id="grandTotal">0.00</span></span>
      </div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 pt-1">
      <button type="button" onclick="saveOnly()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-2 rounded-xl text-xs col-span-2 sm:col-span-1 shadow">
        💾 Save
      </button>
      <button type="button" onclick="showPreview()" class="bg-white hover:bg-slate-50 border border-slate-300 font-bold py-3 px-2 rounded-xl text-xs shadow-sm">
        👁️ View
      </button>
      <button type="button" onclick="runBill('print')" class="bg-white hover:bg-slate-50 border border-slate-300 font-bold py-3 px-2 rounded-xl text-xs shadow-sm">
        🖨️ Print
      </button>
      <button type="button" onclick="runBill('pdf')" class="bg-white hover:bg-slate-50 border border-slate-300 font-bold py-3 px-2 rounded-xl text-xs shadow-sm">
        📄 PDF
      </button>
      <button type="button" onclick="runBill('wa')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-2 rounded-xl text-xs col-span-2 sm:col-span-1 shadow">
        💬 WhatsApp
      </button>
    </div>

  </main>

  <div id="previewModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden p-5 space-y-4 text-xs">
      <div class="text-center border-b pb-2">
        <h3 id="pvBiz" class="font-bold text-sm text-slate-900"></h3>
        <p class="text-slate-400">Retail Bill</p>
      </div>
      <div class="space-y-1">
        <p><strong>Invoice:</strong> <span id="pvInv"></span></p>
        <p><strong>Date:</strong> <span id="pvDate"></span></p>
        <p><strong>Customer:</strong> <span id="pvCust"></span></p>
        <p><strong>Payment:</strong> <span id="pvPay"></span></p>
      </div>
      <table class="w-full border-t border-b">
        <thead>
          <tr class="text-left text-slate-400">
            <th class="py-1">Item</th>
            <th class="py-1 text-center">Qty</th>
            <th class="py-1 text-right">Price</th>
            <th class="py-1 text-right">Total</th>
          </tr>
        </thead>
        <tbody id="pvList"></tbody>
      </table>
      <div class="flex justify-between font-bold text-sm">
        <span>Total:</span>
        <span class="text-indigo-600">₹<span id="pvTot"></span></span>
      </div>
      <button type="button" onclick="closePreview()" class="w-full bg-slate-200 font-bold py-2 rounded-lg">
        Close
      </button>
    </div>
  </div>

  <div id="historyModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden max-h-[85vh] flex flex-col">
      <div class="p-4 border-b flex justify-between items-center bg-slate-50">
        <h3 class="font-bold text-sm">Sales History</h3>
        <button type="button" onclick="closeHistory()" class="text-slate-400 text-lg font-bold">&times;</button>
      </div>
      <div id="historyContent" class="p-4 overflow-y-auto space-y-3 flex-grow text-xs"></div>
      <div class="p-3 border-t bg-slate-50 flex justify-between">
        <button type="button" onclick="wipeHistory()" class="text-rose-600 font-bold text-xs">Clear All</button>
        <button type="button" onclick="closeHistory()" class="bg-slate-200 px-4 py-1.5 rounded-lg font-bold text-xs">Close</button>
      </div>
    </div>
  </div>

  <script>
    window.onload = function() {
      initDate();
      initInvoice();
      addRow();
    };

    function initDate() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      document.getElementById('invDate').value = `${dd}-${mm}-${yyyy}`;
    }

    function initInvoice() {
      let num = localStorage.getItem('ams_num') || '1001';
      document.getElementById('invNum').value = 'INV-' + num;
    }

    function advanceInvoice() {
      const cur = document.getElementById('invNum').value.trim();
      const match = cur.match(/\d+$/);
      if (match) {
        const next = parseInt(match[0], 10) + 1;
        const prefix = cur.substring(0, match.index);
        localStorage.setItem('ams_num', next);
        document.getElementById('invNum').value = prefix + next;
      } else {
        let n = parseInt(localStorage.getItem('ams_num') || '1001', 10) + 1;
        localStorage.setItem('ams_num', n);
        document.getElementById('invNum').value = 'INV-' + n;
      }
    }

    function addRow() {
      const id = 'row_' + Date.now();
      const div = document.createElement('div');
      div.className = 'grid grid-cols-12 gap-2 items-center';
      div.id = id;
      div.innerHTML = `
        <input type="text" placeholder="Item Name" class="row-name col-span-6 bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs outline-none" />
        <input type="number" placeholder="Qty" value="1" min="1" oninput="calcTotal()" class="row-qty col-span-2 bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs text-center outline-none" />
        <input type="number" placeholder="Price" min="0" oninput="calcTotal()" class="row-price col-span-3 bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs text-right outline-none" />
        <button type="button" onclick="removeRow('${id}')" class="col-span-1 text-slate-400 hover:text-rose-600 font-bold text-center text-sm">&times;</button>
      `;
      document.getElementById('itemsBox').appendChild(div);
      calcTotal();
    }

    function removeRow(id) {
      const box = document.getElementById('itemsBox');
      if (box.children.length > 1) {
        document.getElementById(id).remove();
        calcTotal();
      }
    }

    function getItems() {
      const names = document.querySelectorAll('.row-name');
      const qtys = document.querySelectorAll('.row-qty');
      const prices = document.querySelectorAll('.row-price');
      const list = [];

      for (let i = 0; i < names.length; i++) {
        const n = names[i].value.trim() || `Item ${i + 1}`;
        const q = parseFloat(qtys[i].value) || 0;
        const p = parseFloat(prices[i].value) || 0;
        list.push({ name: n, qty: q, price: p, total: (q * p).toFixed(2) });
      }
      return list;
    }

    function calcTotal() {
      const items = getItems();
      let sum = 0;
      items.forEach(it => sum += parseFloat(it.total));
      document.getElementById('grandTotal').innerText = sum.toFixed(2);
      return sum.toFixed(2);
    }

    function saveRecord() {
      const total = calcTotal();
      const items = getItems();
      const invNum = document.getElementById('invNum').value.trim();
      const custName = document.getElementById('custName').value.trim() || 'Dear Customer';
      const phone = document.getElementById('custPhone').value.trim();
      const date = document.getElementById('invDate').value;
      const payment = document.getElementById('paymentMode').value;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const history = JSON.parse(localStorage.getItem('ams_history') || '[]');
      history.unshift({ invNum, custName, phone, date, payment, total, items, time });
      localStorage.setItem('ams_history', JSON.stringify(history));

      advanceInvoice();
    }

    function resetInputs() {
      document.getElementById('itemsBox').innerHTML = '';
      addRow();
      document.getElementById('custPhone').value = '';
      document.getElementById('custName').value = 'Dear Customer';
      calcTotal();
    }

    function saveOnly() {
      const total = parseFloat(calcTotal());
      if (total <= 0) {
        alert('Please enter a price before saving.');
        return;
      }
      saveRecord();
      alert('Bill saved successfully!');
      resetInputs();
    }

    function makePDFObject(biz, inv, dt, cust, pay, tot, items) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text(biz, 14, 20);
      doc.setFontSize(10);
      doc.text(`Invoice: ${inv}`, 14, 28);
      doc.text(`Date: ${dt}`, 14, 34);
      doc.text(`Customer: ${cust}`, 14, 40);
      doc.text(`Payment: ${pay}`, 14, 46);

      const rows = (items || []).map(it => [it.name, it.qty, `Rs. ${it.price}`, `Rs. ${it.total}`]);
      doc.autoTable({
        startY: 52,
        head: [['Item', 'Qty', 'Price', 'Total']],
        body: rows,
        theme: 'grid'
      });

      const y = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(12);
      doc.text(`Total Amount: Rs. ${tot}`, 14, y);
      return doc;
    }

    function buildPDF() {
      const biz = document.getElementById('bizName').value || 'AMS Ladies Bags and Abayas';
      const inv = document.getElementById('invNum').value;
      const dt = document.getElementById('invDate').value;
      const cust = document.getElementById('custName').value || 'Dear Customer';
      const pay = document.getElementById('paymentMode').value;
      const tot = calcTotal();
      const items = getItems();
      return makePDFObject(biz, inv, dt, cust, pay, tot, items);
    }

    function runBill(mode) {
      const total = parseFloat(calcTotal());
      if (total <= 0) {
        alert('Please enter a price first.');
        return;
      }

      const inv = document.getElementById('invNum').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const cust = document.getElementById('custName').value.trim() || 'Dear Customer';
      const biz = document.getElementById('bizName').value.trim() || 'AMS Ladies Bags and Abayas';
      const dt = document.getElementById('invDate').value;
      const pay = document.getElementById('paymentMode').value;

      if (mode === 'print') {
        const doc = buildPDF();
        doc.autoPrint();
        window.open(doc.output('bloburl'), '_blank');
      } else if (mode === 'pdf') {
        const doc = buildPDF();
        doc.save(`${inv}.pdf`);
      } else if (mode === 'wa') {
        if (phone.length < 10) {
          alert('Please enter a valid 10-digit mobile number.');
          return;
        }
        const text = encodeURIComponent(
          `Hello ${cust},\n\n` +
          `Thank you for choosing *${biz}*.\n` +
          `Your invoice *#${inv}* for *₹${total.toFixed(2)}* (${pay}) on ${dt} has been generated.\n\n` +
          `Thank you!`
        );
        window.open(`https://wa.me/91${phone}?text=${text}`, '_blank');
      }

      saveRecord();
      resetInputs();
    }

    // Past Bill Actions (Print, PDF, WhatsApp)
    function printPastBill(idx) {
      const list = JSON.parse(localStorage.getItem('ams_history') || '[]');
      const b = list[idx];
      if (!b) return;
      const biz = document.getElementById('bizName').value || 'AMS Ladies Bags and Abayas';
      const doc = makePDFObject(biz, b.invNum, b.date, b.custName, b.payment, b.total, b.items);
      doc.autoPrint();
      window.open(doc.output('bloburl'), '_blank');
    }

    function pdfPastBill(idx) {
      const list = JSON.parse(localStorage.getItem('ams_history') || '[]');
      const b = list[idx];
      if (!b) return;
      const biz = document.getElementById('bizName').value || 'AMS Ladies Bags and Abayas';
      const doc = makePDFObject(biz, b.invNum, b.date, b.custName, b.payment, b.total, b.items);
      doc.save(`${b.invNum}.pdf`);
    }

    function waPastBill(idx) {
      const list = JSON.parse(localStorage.getItem('ams_history') || '[]');
      const b = list[idx];
      if (!b) return;
      if (!b.phone || b.phone.length < 10) {
        alert('No 10-digit phone number was saved with this bill.');
        return;
      }
      const biz = document.getElementById('bizName').value || 'AMS Ladies Bags and Abayas';
      const text = encodeURIComponent(
        `Hello ${b.custName},\n\n` +
        `Thank you for choosing *${biz}*.\n` +
        `Your invoice *#${b.invNum}* for *₹${b.total}* (${b.payment}) on ${b.date} has been generated.\n\n` +
        `Thank you!`
      );
      window.open(`https://wa.me/91${b.phone}?text=${text}`, '_blank');
    }

    function showPreview(data) {
      const biz = document.getElementById('bizName').value;
      const inv = data ? data.invNum : document.getElementById('invNum').value;
      const dt = data ? data.date : document.getElementById('invDate').value;
      const cust = data ? data.custName : document.getElementById('custName').value;
      const pay = data ? data.payment : document.getElementById('paymentMode').value;
      const tot = data ? data.total : calcTotal();
      const items = data ? data.items : getItems();

      document.getElementById('pvBiz').innerText = biz;
      document.getElementById('pvInv').innerText = inv;
      document.getElementById('pvDate').innerText = dt;
      document.getElementById('pvCust').innerText = cust;
      document.getElementById('pvPay').innerText = pay;
      document.getElementById('pvTot').innerText = tot;

      const tb = document.getElementById('pvList');
      tb.innerHTML = '';
      (items || []).forEach(it => {
        tb.innerHTML += `
          <tr class="border-b">
            <td class="py-1">${it.name}</td>
            <td class="py-1 text-center">${it.qty}</td>
            <td class="py-1 text-right">₹${it.price}</td>
            <td class="py-1 text-right font-bold">₹${it.total}</td>
          </tr>
        `;
      });

      document.getElementById('previewModal').classList.remove('hidden');
    }

    function closePreview() {
      document.getElementById('previewModal').classList.add('hidden');
    }

    function showHistory() {
      const box = document.getElementById('historyContent');
      const list = JSON.parse(localStorage.getItem('ams_history') || '[]');

      if (list.length === 0) {
        box.innerHTML = '<p class="text-center text-slate-400 py-6">No bills recorded yet.</p>';
      } else {
        box.innerHTML = list.map((b, idx) => `
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-slate-800 text-sm">${b.invNum} • ${b.custName}</p>
                <p class="text-[11px] text-slate-500">${b.date} • ${b.payment} ${b.phone ? '• 📱 +91 ' + b.phone : ''}</p>
              </div>
              <p class="font-black text-indigo-700 text-sm">₹${b.total}</p>
            </div>
            <div class="grid grid-cols-4 gap-1 pt-1 border-t border-slate-200">
              <button type="button" onclick='showPreview(${JSON.stringify(b)})' class="bg-white hover:bg-slate-100 border border-slate-300 py-1.5 rounded-lg font-bold text-[10px] text-center shadow-xs">
                👁️ View
              </button>
              <button type="button" onclick='printPastBill(${idx})' class="bg-white hover:bg-slate-100 border border-slate-300 py-1.5 rounded-lg font-bold text-[10px] text-center shadow-xs">
                🖨️ Print
              </button>
              <button type="button" onclick='pdfPastBill(${idx})' class="bg-white hover:bg-slate-100 border border-slate-300 py-1.5 rounded-lg font-bold text-[10px] text-center shadow-xs">
                📄 PDF
              </button>
              <button type="button" onclick='waPastBill(${idx})' class="bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg font-bold text-[10px] text-center shadow-xs">
                💬 WA
              </button>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('historyModal').classList.remove('hidden');
    }

    function closeHistory() {
      document.getElementById('historyModal').classList.add('hidden');
    }

    function wipeHistory() {
      if (confirm('Delete all history?')) {
        localStorage.removeItem('ams_history');
        showHistory();
      }
    }
  </script>
</body>
</html>
